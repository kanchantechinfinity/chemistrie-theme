<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Illustration: two bottles beneath an arch">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#E8D9BF"/>
      <stop offset="1" stop-color="#E6D9C8"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3A2D" stop-opacity=".07"/>
      <stop offset="1" stop-color="#1A3A2D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="400" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="500" fill="url(#ground)"/>

    <!-- arch, echoing the product photography's plaster niches -->
    <path d="M120 500V210a80 80 0 0 1 160 0v290Z" fill="url(#arch)"/>
    <path d="M120 500V210a80 80 0 0 1 160 0v290" fill="none" stroke="#1A3A2D" stroke-opacity=".16" stroke-width="1.2"/>

    <!-- shelf -->
    <path d="M60 396h280" stroke="#1A3A2D" stroke-opacity=".18" stroke-width="1.2"/>

    <!-- taller bottle -->
    <g stroke="#1A3A2D" stroke-opacity=".38" stroke-width="1.4" fill="none">
      <rect x="150" y="286" width="44" height="110" rx="7"/>
      <path d="M165 286v-16h14v16"/>
      <rect x="162" y="258" width="20" height="13" rx="3"/>
      <path d="M150 318h44"/>
    </g>

    <!-- shorter jar -->
    <g stroke="#1A3A2D" stroke-opacity=".3" stroke-width="1.4" fill="none">
      <rect x="212" y="330" width="46" height="66" rx="7"/>
      <path d="M212 348h46"/>
      <rect x="222" y="318" width="26" height="12" rx="3"/>
    </g>

    <!-- sprig -->
    <g stroke="#6C8F7B" stroke-opacity=".5" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M296 396c0-38 10-66 30-86"/>
      <ellipse cx="308" cy="352" rx="11" ry="6.5" transform="rotate(-38 308 352)"/>
      <ellipse cx="318" cy="330" rx="10" ry="6" transform="rotate(-30 318 330)"/>
      <ellipse cx="300" cy="372" rx="10" ry="6" transform="rotate(-46 300 372)"/>
    </g>

    <!-- mark -->
    <circle cx="200" cy="452" r="3" fill="#C8AA7A"/>
  </g>
</svg>
